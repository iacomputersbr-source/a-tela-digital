<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel - A Tela Digital</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff;min-height:100vh}
header{background:#f97316;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:19px;color:#000}
header p{color:#000;font-size:12px}
.lang button{background:#000;color:#fff;border:none;border-radius:16px;padding:7px 12px;margin-left:6px;cursor:pointer;font-size:13px;opacity:.6}
.lang button.on{opacity:1;outline:2px solid #fff}
main{max-width:640px;margin:0 auto;padding:18px}
.card{background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{color:#f97316;font-size:17px;margin-bottom:10px}
.card p,.card li{font-size:14px;line-height:1.7;color:#ddd}
label{display:block;font-size:13px;color:#aaa;margin-top:10px}
input,select,textarea,button{width:100%;border-radius:8px;font-size:15px;padding:12px;margin-top:6px;border:1px solid #444;background:#222;color:#fff}
button{background:#f97316;color:#000;font-weight:bold;border:none;cursor:pointer;margin-top:14px}
button.sec{background:#333;color:#fff}
button.pay{background:#16a34a;color:#fff;padding:8px;font-size:13px;margin-top:8px}
button.danger{background:#dc2626;color:#fff;padding:8px;font-size:13px;margin-top:8px}
button:disabled{opacity:.5}
#login{max-width:340px;margin:60px auto;padding:24px;text-align:center}
.hidden{display:none}
.ok{color:#4ade80}.warn{color:#fbbf24}.err{color:#f87171}
.cli{background:#222;border:1px solid #333;border-radius:10px;padding:12px;margin-top:10px;display:flex;gap:12px;align-items:center}
.cli img{width:74px;height:74px;object-fit:cover;border-radius:8px;flex-shrink:0}
.cli .info{flex:1;font-size:13px;line-height:1.6;min-width:0}
.cli .info b{color:#f97316}
.cli .btns{display:flex;flex-direction:column;gap:4px}
#preview{max-width:100%;border-radius:8px;margin-top:10px;display:none}
#status{margin-top:10px;font-size:14px}
.badge{display:inline-block;font-size:11px;font-weight:bold;padding:3px 10px;border-radius:12px;margin-bottom:4px}
.badge.pago{background:#16a34a;color:#fff}
.badge.pend{background:#f59e0b;color:#000}
</style>
</head>
<body>
<header>
  <div><h1>PAINEL &mdash; A TELA DIGITAL</h1><p>IA COMPUTERS &middot; Curitiba</p></div>
  <div class="lang"><button id="bPT" class="on" onclick="setLang('pt')">🇧🇷</button><button id="bES" onclick="setLang('es')">🇪🇸</button></div>
</header>

<div id="login">
  <div class="card">
    <h2 data-pt="&#x1F512; Acesso restrito" data-es="&#x1F512; Acceso restringido">&#x1F512; Acesso restrito</h2>
    <input type="password" id="senha" data-pt-ph="Digite a senha" data-es-ph="Ingresa la contrase&ntilde;a" placeholder="Digite a senha" style="text-align:center">
    <button onclick="entrar()" data-pt="Entrar" data-es="Entrar">Entrar</button>
    <p id="erro" class="err" style="margin-top:10px"></p>
  </div>
</div>

<main id="painel" class="hidden">

  <div class="card">
    <h2 data-pt="&#x2795; Novo cliente" data-es="&#x2795; Nuevo cliente">&#x2795; Novo cliente</h2>
    <label data-pt="Nome / Empresa *" data-es="Nombre / Empresa *">Nome / Empresa *</label>
    <input id="fNome" placeholder="Ex: Padaria P&atilde;o Dourado">
    <label>CPF / CNPJ</label>
    <input id="fDoc" placeholder="000.000.000-00">
    <label>E-mail</label>
    <input id="fEmail" type="email" placeholder="cliente@email.com">
    <label data-pt="Telefone / WhatsApp *" data-es="Tel&eacute;fono / WhatsApp *">Telefone / WhatsApp *</label>
    <input id="fFone" placeholder="(41) 99999-9999">
    <label data-pt="Plano *" data-es="Plan *">Plano *</label>
    <select id="fPlano" onchange="planoMudou()">
      <option value="1_dia" data-pt="1 dia (24h) &mdash; R$ 15" data-es="1 d&iacute;a (24h) &mdash; R$ 15">1 dia (24h) &mdash; R$ 15</option>
      <option value="7_dias" selected data-pt="7 dias &mdash; R$ 90" data-es="7 d&iacute;as &mdash; R$ 90">7 dias &mdash; R$ 90</option>
      <option value="1_mes" data-pt="30 dias &mdash; R$ 300" data-es="30 d&iacute;as &mdash; R$ 300">30 dias &mdash; R$ 300</option>
    </select>
    <label data-pt="Valor (R$) *" data-es="Valor (R$) *">Valor (R$) *</label>
    <input id="fValor" type="number" min="0" max="1000" step="0.01" value="90">
    <label data-pt="Pagamento *" data-es="Pago *">Pagamento *</label>
    <select id="fPag">
      <option value="pago" data-pt="&#x2705; Pago &mdash; publicar agora" data-es="&#x2705; Pagado &mdash; publicar ahora">&#x2705; Pago &mdash; publicar agora</option>
      <option value="pendente" data-pt="&#x23F3; Pendente &mdash; aguardar pagamento" data-es="&#x23F3; Pendiente &mdash; esperar pago">&#x23F3; Pendente &mdash; aguardar pagamento</option>
    </select>
    <label data-pt="Imagem do an&uacute;ncio *" data-es="Imagen del anuncio *">Imagem do an&uacute;ncio *</label>
    <input id="fImg" type="file" accept="image/*">
    <img id="preview" alt="pr&eacute;via">
    <button id="btnSalvar" onclick="salvar()" data-pt="&#x1F4BE; Salvar e publicar" data-es="&#x1F4BE; Guardar y publicar">&#x1F4BE; Salvar e publicar</button>
    <p id="status"></p>
  </div>

  <div class="card" id="cardPend" style="display:none">
    <h2 data-pt="&#x23F3; Aguardando pagamento" data-es="&#x23F3; Esperando pago">&#x23F3; Aguardando pagamento</h2>
    <div id="listaPend"></div>
  </div>

  <div class="card">
    <h2><span data-pt="&#x1F5BC;&#xFE0F; An&uacute;ncios ativos" data-es="&#x1F5BC;&#xFE0F; Anuncios activos">&#x1F5BC;&#xFE0F; An&uacute;ncios ativos</span> <span id="contAtivos"></span></h2>
    <div id="lista"><p>Carregando...</p></div>
  </div>

  <div class="card">
    <h2 data-pt="&#x23F1;&#xFE0F; Configura&ccedil;&atilde;o da tela" data-es="&#x23F1;&#xFE0F; Configuraci&oacute;n de pantalla">&#x23F1;&#xFE0F; Configura&ccedil;&atilde;o da tela</h2>
    <label data-pt="Segundos por imagem" data-es="Segundos por imagen">Segundos por imagem</label>
    <input id="fIntervalo" type="number" min="3" max="60" value="8">
    <button class="sec" onclick="salvarIntervalo()" data-pt="Salvar intervalo" data-es="Guardar intervalo">Salvar intervalo</button>
    <p style="margin-top:12px"><b class="ok" data-pt="Tela (para o TV):" data-es="Pantalla (para el TV):">Tela (para o TV):</b><br>
    <span id="linkTela" style="word-break:break-all;font-size:13px"></span></p>
    <p style="margin-top:8px"><b class="ok" data-pt="P&aacute;gina de vendas:" data-es="P&aacute;gina de ventas:">P&aacute;gina de vendas:</b><br>
    <span id="linkVendas" style="word-break:break-all;font-size:13px"></span></p>
  </div>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBxz-Y-QtDuZEwFDv9dyQGziQDqvzf_uaE",
  authDomain: "a-tela-digital.firebaseapp.com",
  projectId: "a-tela-digital",
  storageBucket: "a-tela-digital.firebasestorage.app",
  messagingSenderId: "419054924443",
  appId: "1:419054924443:web:510a842f13a3ec9d174c3e",
  measurementId: "G-W5YVP430ES"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const SENHA_HASH = "27e73df45d053dc6a9b6e60ca97edd73ac954618eda30576d2703541461ac554";
const PLANOS = {
  '1_dia':  {dias: 1,  rotulo: '1 dia',  preco: 15},
  '7_dias': {dias: 7,  rotulo: '7 dias', preco: 90},
  '1_mes':  {dias: 30, rotulo: '30 dias',preco: 300}
};

const T = {
  pt: {senhaErr:'&#x274C; Senha incorreta', nome:'&#x274C; Informe o nome/empresa.', fone:'&#x274C; Informe o telefone.',
    valor:'&#x274C; Valor deve ser entre R$ 0 e R$ 1000.', img:'&#x274C; Escolha a imagem do an&uacute;ncio.',
    proc:'&#x23F3; Processando imagem...', salv:'&#x23F3; Salvando no banco de dados...',
    pub:'&#x2705; Publicado! Expira em ', pend:'&#x23F3; Salvo como pendente. Marque como pago para publicar.',
    erro:'&#x274C; Erro: ', nenhum:'Nenhum an&uacute;ncio ativo.', expira:'&#x23F3; Expira em: ',
    remover:'Remover este an&uacute;ncio da tela?', interv:'&#x2705; Intervalo salvo: ', seg:' segundos por imagem.',
    pago:'&#x2705; PAGO', pendente:'&#x23F3; PENDENTE', marcarPago:'&#x1F4B0; Marcar como pago', nenhumPend:'Nenhum pagamento pendente.',
    confirmarPago:'Confirmar pagamento e publicar?'},
  es: {senhaErr:'&#x274C; Contrase&ntilde;a incorrecta', nome:'&#x274C; Ingresa el nombre/empresa.', fone:'&#x274C; Ingresa el tel&eacute;fono.',
    valor:'&#x274C; El valor debe estar entre R$ 0 y R$ 1000.', img:'&#x274C; Elige la imagen del anuncio.',
    proc:'&#x23F3; Procesando imagen...', salv:'&#x23F3; Guardando en la base de datos...',
    pub:'&#x2705; &iexcl;Publicado! Vence en ', pend:'&#x23F3; Guardado como pendiente. M&aacute;rcalo como pagado para publicar.',
    erro:'&#x274C; Error: ', nenhum:'Ning&uacute;n anuncio activo.', expira:'&#x23F3; Vence en: ',
    remover:'&iquest;Eliminar este anuncio de la pantalla?', interv:'&#x2705; Intervalo guardado: ', seg:' segundos por imagen.',
    pago:'&#x2705; PAGADO', pendente:'&#x23F3; PENDIENTE', marcarPago:'&#x1F4B0; Marcar como pagado', nenhumPend:'Ning&uacute;n pago pendiente.',
    confirmarPago:'&iquest;Confirmar pago y publicar?'}
};
let lang = 'pt';

function setLang(l){
  lang = l;
  document.getElementById('bPT').classList.toggle('on', l==='pt');
  document.getElementById('bES').classList.toggle('on', l==='es');
  document.querySelectorAll('[data-pt]').forEach(el=>{ el.innerHTML = (l==='pt') ? el.dataset.pt : el.dataset.es; });
  document.querySelectorAll('[data-pt-ph]').forEach(el=>{ el.placeholder = (l==='pt') ? el.dataset.ptPh : el.dataset.esPh; });
  carregarClientes();
}

async function sha256(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

async function entrar(){
  const v = document.getElementById('senha').value;
  let h = '';
  try{ h = await sha256(v); }catch(e){}
  if(h === SENHA_HASH){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('painel').classList.remove('hidden');
    const base = location.href.replace(/\/painel\.html.*$/, '/');
    document.getElementById('linkTela').textContent = base + 'tela.html';
    document.getElementById('linkVendas').textContent = base + 'index.html';
    carregarClientes();
    carregarIntervalo();
  } else {
    document.getElementById('erro').innerHTML = T[lang].senhaErr;
  }
}
document.getElementById('senha').addEventListener('keydown', e => { if(e.key==='Enter') entrar(); });

function planoMudou(){
  const p = document.getElementById('fPlano').value;
  document.getElementById('fValor').value = PLANOS[p].preco;
}

document.getElementById('fImg').addEventListener('change', function(){
  const f = this.files[0];
  const pv = document.getElementById('preview');
  if(f){ pv.src = URL.createObjectURL(f); pv.style.display = 'block'; }
  else { pv.style.display = 'none'; }
});

function tempoRestante(expira){
  const ms = expira.toDate().getTime() - Date.now();
  if(ms <= 0) return 'vencido';
  const d = Math.floor(ms/864e5), h = Math.floor(ms%864e5/36e5), m = Math.floor(ms%36e5/6e4);
  if(d > 0) return d+'d '+h+'h';
  if(h > 0) return h+'h '+m+'min';
  return m+'min';
}

function comprimirImagem(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1600;
        let w = img.width, h = img.height;
        if(w > MAX || h > MAX){ const r = Math.min(MAX/w, MAX/h); w = Math.round(w*r); h = Math.round(h*r); }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => reject(new Error('No se pudo leer la imagen.'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('No se pudo leer el archivo.'));
    reader.readAsDataURL(file);
  });
}

async function salvar(){
  const nome = document.getElementById('fNome').value.trim();
  const doc = document.getElementById('fDoc').value.trim();
  const email = document.getElementById('fEmail').value.trim();
  const fone = document.getElementById('fFone').value.trim();
  const plano = document.getElementById('fPlano').value;
  const valor = parseFloat(document.getElementById('fValor').value);
  const pag = document.getElementById('fPag').value;
  const file = document.getElementById('fImg').files[0];
  const st = document.getElementById('status');
  const btn = document.getElementById('btnSalvar');

  if(!nome){ st.innerHTML = '<span class="err">'+T[lang].nome+'</span>'; return; }
  if(!fone){ st.innerHTML = '<span class="err">'+T[lang].fone+'</span>'; return; }
  if(isNaN(valor) || valor < 0 || valor > 1000){ st.innerHTML = '<span class="err">'+T[lang].valor+'</span>'; return; }
  if(!file){ st.innerHTML = '<span class="err">'+T[lang].img+'</span>'; return; }

  btn.disabled = true;
  try{
    st.innerHTML = '<span class="warn">'+T[lang].proc+'</span>';
    const imagemData = await comprimirImagem(file);
    st.innerHTML = '<span class="warn">'+T[lang].salv+'</span>';
    const dias = PLANOS[plano].dias;
    const agora = new Date();
    const expira = new Date(agora.getTime() + dias*864e5);
    const pago = (pag === 'pago');
    await db.collection('clientes').add({
      nome, cpfCnpj: doc, email, telefone: fone,
      plano, planoRotulo: PLANOS[plano].rotulo,
      valor: valor, pagamento: pag, ativo: pago,
      imagemData: imagemData,
      criadoEm: firebase.firestore.Timestamp.fromDate(agora),
      expiraEm: firebase.firestore.Timestamp.fromDate(expira)
    });
    st.innerHTML = pago
      ? '<span class="ok">'+T[lang].pub + PLANOS[plano].rotulo + '.</span>'
      : '<span class="warn">'+T[lang].pend+'</span>';
    ['fNome','fDoc','fEmail','fFone'].forEach(id => document.getElementById(id).value='');
    document.getElementById('fImg').value='';
    document.getElementById('preview').style.display='none';
    planoMudou();
    carregarClientes();
  }catch(e){
    console.error(e);
    st.innerHTML = '<span class="err">'+T[lang].erro + e.message + '</span>';
  }
  btn.disabled = false;
}

function cardCliente(id, c, pendente){
  const imgSrc = c.imagemData || c.imagemURL || '';
  const div = document.createElement('div');
  div.className = 'cli';
  const badge = pendente
    ? '<span class="badge pend">'+T[lang].pendente+'</span><br>'
    : '<span class="badge pago">'+T[lang].pago+'</span><br>';
  div.innerHTML =
    '<img src="'+imgSrc+'">' +
    '<div class="info">' + badge + '<b>'+esc(c.nome)+'</b><br>' +
    '&#x1F4CB; ' + esc(c.planoRotulo||'') + ' &middot; &#x1F4B0; R$ ' + Number(c.valor||0).toFixed(2).replace('.',',') + '<br>' +
    T[lang].expira + '<b>'+tempoRestante(c.expiraEm)+'</b><br>' +
    '&#x1F4DE; ' + esc(c.telefone||'') + '</div>';
  const btns = document.createElement('div');
  btns.className = 'btns';
  if(pendente){
    const bp = document.createElement('button');
    bp.className = 'pay'; bp.innerHTML = T[lang].marcarPago; bp.style.width='auto';
    bp.onclick = () => marcarPago(id);
    btns.appendChild(bp);
  }
  const bd = document.createElement('button');
  bd.className = 'danger'; bd.textContent = '&#x1F5D1;&#xFE0F;'; bd.style.width='auto';
  bd.onclick = () => excluir(id);
  btns.appendChild(bd);
  div.appendChild(btns);
  return div;
}

async function carregarClientes(){
  const lista = document.getElementById('lista');
  const listaPend = document.getElementById('listaPend');
  const cardPend = document.getElementById('cardPend');
  try{
    const agora = new Date();
    const snap = await db.collection('clientes')
      .where('expiraEm','>',agora)
      .orderBy('expiraEm','asc').get();
    let nAtivos = 0, nPend = 0;
    lista.innerHTML = ''; listaPend.innerHTML = '';
    snap.forEach(d => {
      const c = d.data();
      const pendente = (c.ativo === false);
      if(pendente){ listaPend.appendChild(cardCliente(d.id, c, true)); nPend++; }
      else { lista.appendChild(cardCliente(d.id, c, false)); nAtivos++; }
    });
    document.getElementById('contAtivos').textContent = '(' + nAtivos + ')';
    if(!nAtivos) lista.innerHTML = '<p class="warn">'+T[lang].nenhum+'</p>';
    cardPend.style.display = nPend ? 'block' : 'none';
    if(!nPend) listaPend.innerHTML = '<p class="warn">'+T[lang].nenhumPend+'</p>';
  }catch(e){ lista.innerHTML = '<p class="err">'+T[lang].erro + e.message + '</p>'; }
}

function esc(s){ return String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

async function excluir(id){
  if(!confirm(T[lang].remover)) return;
  try{ await db.collection('clientes').doc(id).delete(); carregarClientes(); }
  catch(e){ alert(T[lang].erro + e.message); }
}

async function marcarPago(id){
  if(!confirm(T[lang].confirmarPago)) return;
  try{ await db.collection('clientes').doc(id).update({ativo:true, pagamento:'pago'}); carregarClientes(); }
  catch(e){ alert(T[lang].erro + e.message); }
}

async function carregarIntervalo(){
  const doc = await db.collection('config').doc('geral').get().catch(()=>null);
  if(doc && doc.exists && doc.data().intervalo){
    document.getElementById('fIntervalo').value = doc.data().intervalo;
  }
}

async function salvarIntervalo(){
  const v = parseInt(document.getElementById('fIntervalo').value) || 8;
  await db.collection('config').doc('geral').set({intervalo: v}, {merge:true});
  alert(T[lang].interv + v + T[lang].seg);
}

setInterval(() => { if(!document.getElementById('painel').classList.contains('hidden')) carregarClientes(); }, 60000);
</script>
</body>
</html>
