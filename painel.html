<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel - A Tela Digital</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff;min-height:100vh}
header{background:#f97316;padding:16px;text-align:center}
header h1{font-size:20px;color:#000}
header p{color:#000;font-size:12px;margin-top:4px}
main{max-width:680px;margin:0 auto;padding:16px}
.card{background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{color:#f97316;font-size:17px;margin-bottom:10px}
.card p,.card li{font-size:14px;line-height:1.7;color:#ddd}
input,textarea,button{width:100%;border-radius:8px;font-size:15px;padding:12px;margin-top:8px;border:1px solid #444;background:#222;color:#fff}
button{background:#f97316;color:#000;font-weight:bold;border:none;cursor:pointer;margin-top:10px}
button.sec{background:#333;color:#fff}
button.danger{background:#7f1d1d;color:#fff}
button:disabled{opacity:.5}
#login{max-width:340px;margin:60px auto;padding:24px;text-align:center}
#login input{text-align:center}
.hidden{display:none}
.ok{color:#4ade80}.warn{color:#fbbf24}
.loja{background:#222;border:1px solid #444;border-radius:10px;padding:12px;margin-top:12px}
.loja.nom{font-size:16px;color:#f97316;font-weight:bold}
.loja.fon{font-size:13px;color:#aaa}
.fila{display:flex;gap:8px}
.fila button{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.an{position:relative;background:#000;border-radius:8px;overflow:hidden}
.an img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.an.t{font-size:11px;padding:6px;color:#ddd;min-height:28px}
.an.x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:28px;height:28px;font-size:14px;padding:0;margin:0;cursor:pointer}
code{background:#000;color:#f97316;padding:2px 6px;border-radius:4px;font-size:12px;word-break:break-all}
.cargando{text-align:center;color:#888;padding:20px}
@media (max-width:520px){main{padding:12px}input,textarea,button{font-size:16px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <h1>PAINEL &mdash; A TELA DIGITAL</h1>
  <p>IA COMPUTERS &middot; Curitiba &middot; todo autom&aacute;tico</p>
</header>

<div id="login">
  <div class="card">
    <h2>Acceso restringido</h2>
    <input type="password" id="senha" placeholder="Clave" inputmode="numeric">
    <button onclick="entrar()">Entrar</button>
    <p id="erro" class="warn" style="margin-top:10px"></p>
  </div>
</div>

<main id="painel" class="hidden">
  <div class="card">
    <h2>&#9201; Intervalo de la tela</h2>
    <p>Segundos que dura cada imagen en el TV:</p>
    <div class="fila">
      <input type="number" id="intervalo" value="8" min="3" max="60" style="margin-top:8px">
      <button onclick="salvarIntervalo()" style="margin-top:8px">&#128190; Guardar</button>
    </div>
  </div>

  <div class="card">
    <h2>&#10133; Nueva tienda</h2>
    <input id="nomeLoja" placeholder="Nombre de la tienda (ej: Padaria P&atilde;o Quente)">
    <input id="foneLoja" placeholder="WhatsApp (ej: 41997294355)" inputmode="tel">
    <button onclick="criarLoja()">&#10133; Crear tienda</button>
  </div>

  <div class="card">
    <h2>&#127978; Tiendas y anuncios</h2>
    <div id="lojas"><p class="cargando">Cargando...</p></div>
  </div>

  <div class="card">
    <h2>&#128250; Links</h2>
    <p><b class="ok">Tela (para el TV):</b><br><code id="linkTela"></code></p>
    <p style="margin-top:8px"><b class="ok">Ofertas (directorio):</b><br><code id="linkOfertas"></code></p>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyBxz-Y-QtDuZEwFDv9dyQGziQDqvzf_uaE",
  authDomain: "a-tela-digital.firebaseapp.com",
  projectId: "a-tela-digital",
  storageBucket: "a-tela-digital.firebasestorage.app",
  messagingSenderId: "419054924443",
  appId: "1:419054924443:web:510a842f13a3ec9d174c3e",
  measurementId: "G-W5YVP430ES"
});
var db = firebase.firestore();

function entrar(){
  var s = document.getElementById('senha').value;
  if(s === '2024'){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('painel').classList.remove('hidden');
    var base = location.href.replace(/\/painel\.html.*$/, '/');
    document.getElementById('linkTela').textContent = base + 'tela.html';
    document.getElementById('linkOfertas').textContent = base + 'oferta.html';
    carregarIntervalo();
    carregarLojas();
  } else {
    document.getElementById('erro').textContent = 'Clave incorrecta';
  }
}
document.getElementById('senha').addEventListener('keydown', function(e){ if(e.key==='Enter') entrar(); });

function esc(s){ return String(s||'').replace(/[&<>"]/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]); }); }

function carregarIntervalo(){
  db.collection('config').doc('tela').get().then(function(d){
    if(d.exists && d.data().intervalo) document.getElementById('intervalo').value = d.data().intervalo;
  }).catch(function(){});
}
function salvarIntervalo(){
  var v = parseInt(document.getElementById('intervalo').value, 10) || 8;
  db.collection('config').doc('tela').set({intervalo: v}).then(function(){
    alert('Intervalo guardado: ' + v + ' segundos');
  }).catch(function(e){ alert('Error: ' + e.message); });
}

function criarLoja(){
  var nome = document.getElementById('nomeLoja').value.trim();
  var fone = document.getElementById('foneLoja').value.replace(/\D/g, '');
  if(!nome){ alert('Escribe el nombre de la tienda'); return; }
  db.collection('clientes').add({nome: nome, fone: fone, criadoEm: new Date()}).then(function(){
    document.getElementById('nomeLoja').value = '';
    document.getElementById('foneLoja').value = '';
    carregarLojas();
  }).catch(function(e){ alert('Error: ' + e.message); });
}

function redimensionar(file){
  return new Promise(function(res, rej){
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      var max = 1280, w = img.width, h = img.height;
      if(w > max || h > max){ var r = Math.min(max/w, max/h); w = Math.round(w*r); h = Math.round(h*r); }
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = rej;
    img.src = url;
  });
}

function addAnuncio(id){
  var fi = document.getElementById('file-' + id);
  var ti = document.getElementById('tit-' + id);
  if(!fi.files.length){ alert('Elige una imagen de tu galería'); return; }
  var titulo = ti.value.trim() || 'Oferta';
  var btn = document.getElementById('btn-' + id);
  btn.disabled = true; btn.textContent = 'Subiendo...';
  redimensionar(fi.files[0]).then(function(dataUrl){
    return db.collection('clientes').doc(id).collection('anuncios').add({img: dataUrl, titulo: titulo, criadoEm: new Date()});
  }).then(function(){
    fi.value = ''; ti.value = '';
    btn.disabled = false; btn.textContent = 'Agregar anuncio';
    carregarLojas();
  }).catch(function(e){
    btn.disabled = false; btn.textContent = 'Agregar anuncio';
    alert('Error: ' + e.message);
  });
}

function delAnuncio(cid, aid){
  if(!confirm('Borrar este anuncio?')) return;
  db.collection('clientes').doc(cid).collection('anuncios').doc(aid).delete().then(carregarLojas);
}

function delLoja(id, nome){
  if(!confirm('Borrar la tienda "' + nome + '" y todos sus anuncios?')) return;
  db.collection('clientes').doc(id).collection('anuncios').get().then(function(s){
    var ps = [];
    s.forEach(function(d){ ps.push(d.ref.delete()); });
    return Promise.all(ps);
  }).then(function(){
    return db.collection('clientes').doc(id).delete();
  }).then(carregarLojas);
}

function copiarLink(id){
  var base = location.href.replace(/\/painel\.html.*$/, '/');
  var url = base + 'oferta.html?loja=' + id;
  if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(function(){ alert('Link copiado. Envíeselo al dueño por WhatsApp'); });
  } else { prompt('Copia el link:', url); }
}

function carregarLojas(){
  var box = document.getElementById('lojas');
  db.collection('clientes').orderBy('criadoEm', 'desc').get().then(function(snap){
    if(snap.empty){ box.innerHTML = '<p class="cargando">Aún no hay tiendas. Crea la primera arriba.</p>'; return; }
    var html = '';
    var ids = [];
    snap.forEach(function(doc){
      var c = doc.data();
      ids.push(doc.id);
      html += '<div class="loja" id="loja-' + doc.id + '">'
        + '<div class="nom">🏪 ' + esc(c.nome) + '</div>'
        + (c.fone? '<div class="fon">· ' + esc(c.fone) + '</div>' : '')
        + '<div class="fila"><button class="sec" onclick="copiarLink(\'' + doc.id + '\')">🔗 Copiar link</button>'
        + '<button class="danger" onclick="delLoja(\'' + doc.id + '\',\'' + esc(c.nome).replace(/\'/g, "\\'") + '\')" style="flex:0 0 52px">🗑️</button></div>'
        + '<input type="file" accept="image/*" id="file-' + doc.id + '">'
        + '<input placeholder="Título del anuncio (ej: Pão R$ 5)" id="tit-' + doc.id + '">'
        + '<button id="btn-' + doc.id + '" onclick="addAnuncio(\'' + doc.id + '\')">🖼️ Agregar anuncio</button>'
        + '<div class="grid" id="ads-' + doc.id + '"><p class="cargando">...</p></div>'
        + '</div>';
    });
    box.innerHTML = html;
    ids.forEach(function(id){
      db.collection('clientes').doc(id).collection('anuncios').orderBy('criadoEm', 'desc').get().then(function(a){
        var g = document.getElementById('ads-' + id);
        if(!g) return;
        if(a.empty){ g.innerHTML = '<p class="cargando">Sin anuncios</p>'; return; }
        var h = '';
        a.forEach(function(d){
          var an = d.data();
          h += '<div class="an"><img src="' + an.img + '"><div class="t">' + esc(an.titulo || '') + '</div>'
            + '<button class="x" onclick="delAnuncio(\'' + id + '\',\'' + d.id + '\')">×</button></div>';
        });
        g.innerHTML = h;
      });
    });
  }).catch(function(e){
    box.innerHTML = '<p class="warn">Error: ' + esc(e.message) + '</p>';
  });
}
</script>
</body>
   </html>
