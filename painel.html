<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel - A Tela Digital ⚙️</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff;min-height:100vh}
  header{background:#f97316;padding:18px;text-align:center}
  header h1{font-size:22px;color:#000}
  header p{color:#000;font-size:13px;margin-top:4px}
  main{max-width:640px;margin:0 auto;padding:18px}
  .card{background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:16px}
  .card h2{color:#f97316;font-size:17px;margin-bottom:10px}
  .card p,.card li{font-size:14px;line-height:1.7;color:#ddd}
  label{display:block;font-size:13px;color:#aaa;margin-top:10px}
  input,select,textarea,button{width:100%;border-radius:8px;font-size:15px;padding:12px;margin-top:6px;border:1px solid #444;background:#222;color:#fff}
  button{background:#f97316;color:#000;font-weight:bold;border:none;cursor:pointer;margin-top:14px}
  button.sec{background:#333;color:#fff}
  button.danger{background:#dc2626;color:#fff;padding:8px;font-size:13px;margin-top:8px}
  button:disabled{opacity:.5}
  #login{max-width:340px;margin:60px auto;padding:24px;text-align:center}
  .hidden{display:none}
  .ok{color:#4ade80}.warn{color:#fbbf24}.err{color:#f87171}
  .cli{background:#222;border:1px solid #333;border-radius:10px;padding:12px;margin-top:10px;display:flex;gap:12px;align-items:center}
  .cli img{width:74px;height:74px;object-fit:cover;border-radius:8px;flex-shrink:0}
  .cli .info{flex:1;font-size:13px;line-height:1.6;min-width:0}
  .cli .info b{color:#f97316}
  #preview{max-width:100%;border-radius:8px;margin-top:10px;display:none}
  #status{margin-top:10px;font-size:14px}
  code{background:#000;color:#f97316;padding:2px 6px;border-radius:4px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>⚙️ PAINEL — A TELA DIGITAL</h1>
  <p>IA COMPUTERS · Curitiba</p>
</header>

<div id="login">
  <div class="card">
    <h2>🔒 Acesso restrito</h2>
    <input type="password" id="senha" placeholder="Digite a senha" inputmode="numeric" style="text-align:center">
    <button onclick="entrar()">Entrar</button>
    <p id="erro" class="err" style="margin-top:10px"></p>
  </div>
</div>

<main id="painel" class="hidden">

  <div class="card">
    <h2>➕ Novo cliente</h2>
    <label>Nome / Empresa *</label>
    <input id="fNome" placeholder="Ex: Padaria Pão Dourado">
    <label>CPF / CNPJ</label>
    <input id="fDoc" placeholder="000.000.000-00">
    <label>E-mail</label>
    <input id="fEmail" type="email" placeholder="cliente@email.com">
    <label>Telefone / WhatsApp *</label>
    <input id="fFone" placeholder="(41) 99999-9999">
    <label>Plano *</label>
    <select id="fPlano">
      <option value="1_dia">1 dia (24 horas)</option>
      <option value="7_dias" selected>7 dias</option>
      <option value="1_mes">1 mês (30 dias)</option>
    </select>
    <label>Valor do plano (R$ 0 – 1000) *</label>
    <input id="fValor" type="number" min="0" max="1000" step="0.01" placeholder="Ex: 149.90">
    <label>Imagem do anúncio *</label>
    <input id="fImg" type="file" accept="image/*">
    <img id="preview" alt="prévia">
    <button id="btnSalvar" onclick="salvar()">💾 Salvar e publicar</button>
    <p id="status"></p>
  </div>

  <div class="card">
    <h2>🖼️ Anúncios ativos <span id="contAtivos"></span></h2>
    <div id="lista"><p>Carregando...</p></div>
  </div>

  <div class="card">
    <h2>⏱️ Configuração da tela</h2>
    <label>Segundos por imagem</label>
    <input id="fIntervalo" type="number" min="3" max="60" value="8">
    <button class="sec" onclick="salvarIntervalo()">Salvar intervalo</button>
    <p style="margin-top:12px"><b class="ok">Tela (para o TV):</b><br>
    <span id="linkTela" style="word-break:break-all;font-size:13px"></span></p>
  </div>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBxz-Y-QtDuZEwFDv9dyQGziQDqvzf_uaE",
  authDomain: "a-tela-digital.firebaseapp.com",
  projectId: "a-tela-digital",
  storageBucket: "a-tela-digital.firebasestorage.app",
  messagingSenderId: "419054924443",
  appId: "1:419054924443:web:510a842f13a3ec9d174c3e",
  measurementId: "G-W5YVP430ES"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

const PLANOS = {
  '1_dia':  {dias: 1,  rotulo: '1 dia'},
  '7_dias': {dias: 7,  rotulo: '7 dias'},
  '1_mes':  {dias: 30, rotulo: '1 mês'}
};

function entrar(){
  if(document.getElementById('senha').value === '2024'){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('painel').classList.remove('hidden');
    const base = location.href.replace(/\/painel\.html.*$/, '/');
    document.getElementById('linkTela').textContent = base + 'tela.html';
    carregarClientes();
    carregarIntervalo();
  } else {
    document.getElementById('erro').textContent = '❌ Senha incorreta';
  }
}
document.getElementById('senha').addEventListener('keydown', e => { if(e.key==='Enter') entrar(); });

document.getElementById('fImg').addEventListener('change', function(){
  const f = this.files[0];
  const pv = document.getElementById('preview');
  if(f){ pv.src = URL.createObjectURL(f); pv.style.display = 'block'; }
  else { pv.style.display = 'none'; }
});

function tempoRestante(expira){
  const ms = expira.toDate().getTime() - Date.now();
  if(ms <= 0) return 'vencido';
  const d = Math.floor(ms/864e5), h = Math.floor(ms%864e5/36e5), m = Math.floor(ms%36e5/6e4);
  if(d > 0) return d+'d '+h+'h';
  if(h > 0) return h+'h '+m+'min';
  return m+'min';
}

async function salvar(){
  const nome = document.getElementById('fNome').value.trim();
  const doc = document.getElementById('fDoc').value.trim();
  const email = document.getElementById('fEmail').value.trim();
  const fone = document.getElementById('fFone').value.trim();
  const plano = document.getElementById('fPlano').value;
  const valor = parseFloat(document.getElementById('fValor').value);
  const file = document.getElementById('fImg').files[0];
  const st = document.getElementById('status');
  const btn = document.getElementById('btnSalvar');

  if(!nome){ st.innerHTML = '<span class="err">❌ Informe o nome/empresa.</span>'; return; }
  if(!fone){ st.innerHTML = '<span class="err">❌ Informe o telefone.</span>'; return; }
  if(isNaN(valor) || valor < 0 || valor > 1000){ st.innerHTML = '<span class="err">❌ Valor deve ser entre R$ 0 e R$ 1000.</span>'; return; }
  if(!file){ st.innerHTML = '<span class="err">❌ Escolha a imagem do anúncio.</span>'; return; }

  btn.disabled = true;
  try{
    st.innerHTML = '<span class="warn">⏳ Enviando imagem...</span>';
    const nomeArq = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.\-_]/g,'_');
    const ref = storage.ref('imagens/' + nomeArq);
    await ref.put(file);
    const url = await ref.getDownloadURL();

    const dias = PLANOS[plano].dias;
    const agora = new Date();
    const expira = new Date(agora.getTime() + dias*864e5);

    await db.collection('clientes').add({
      nome, cpfCnpj: doc, email, telefone: fone,
      plano, planoRotulo: PLANOS[plano].rotulo,
      valor: valor,
      imagemURL: url, imagemPath: 'imagens/' + nomeArq,
      criadoEm: firebase.firestore.Timestamp.fromDate(agora),
      expiraEm: firebase.firestore.Timestamp.fromDate(expira),
      ativo: true
    });

    st.innerHTML = '<span class="ok">✅ Publicado! Expira em ' + PLANOS[plano].rotulo + '.</span>';
    ['fNome','fDoc','fEmail','fFone','fValor'].forEach(id => document.getElementById(id).value='');
    document.getElementById('fImg').value='';
    document.getElementById('preview').style.display='none';
    carregarClientes();
  }catch(e){
    console.error(e);
    st.innerHTML = '<span class="err">❌ Erro: ' + e.message + '</span>';
  }
  btn.disabled = false;
}

async function carregarClientes(){
  const lista = document.getElementById('lista');
  try{
    const agora = new Date();
    const snap = await db.collection('clientes')
      .where('expiraEm','>',agora)
      .orderBy('expiraEm','asc').get();
    document.getElementById('contAtivos').textContent = '(' + snap.size + ')';
    if(!snap.size){ lista.innerHTML = '<p class="warn">Nenhum anúncio ativo.</p>'; return; }
    lista.innerHTML = '';
    snap.forEach(d => {
      const c = d.data();
      const div = document.createElement('div');
      div.className = 'cli';
      div.innerHTML =
        '<img src="'+c.imagemURL+'">' +
        '<div class="info"><b>'+esc(c.nome)+'</b><br>' +
        '📋 ' + esc(c.planoRotulo||'') + ' · 💰 R$ ' + Number(c.valor).toFixed(2).replace('.',',') + '<br>' +
        '⏳ Expira em: <b>'+tempoRestante(c.expiraEm)+'</b><br>' +
        '📞 ' + esc(c.telefone||'') + '</div>';
      const btn = document.createElement('button');
      btn.className = 'danger'; btn.textContent = '🗑️';
      btn.style.width = 'auto';
      btn.onclick = () => excluir(d.id, c.imagemPath);
      div.appendChild(btn);
      lista.appendChild(div);
    });
  }catch(e){ lista.innerHTML = '<p class="err">Erro: '+e.message+'</p>'; }
}

function esc(s){ return String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

async function excluir(id, path){
  if(!confirm('Remover este anúncio da tela?')) return;
  try{
    if(path){ await storage.ref(path).delete().catch(()=>{}); }
    await db.collection('clientes').doc(id).delete();
    carregarClientes();
  }catch(e){ alert('Erro: ' + e.message); }
}

async function carregarIntervalo(){
  const doc = await db.collection('config').doc('geral').get().catch(()=>null);
  if(doc && doc.exists && doc.data().intervalo){
    document.getElementById('fIntervalo').value = doc.data().intervalo;
  }
}

async function salvarIntervalo(){
  const v = parseInt(document.getElementById('fIntervalo').value) || 8;
  await db.collection('config').doc('geral').set({intervalo: v}, {merge:true});
  alert('✅ Intervalo salvo: ' + v + ' segundos por imagem.');
}

setInterval(() => { if(!document.getElementById('painel').classList.contains('hidden')) carregarClientes(); }, 60000);
</script>
</body>
</html>
