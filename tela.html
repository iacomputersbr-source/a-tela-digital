<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Tela Digital 📺</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;cursor:none}
#tela{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#tela img{max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity 1s}
#tela img.vis{opacity:1}
#vazio{color:#555;font-family:Arial;font-size:24px;text-align:center;padding:40px}
#logo{position:fixed;bottom:14px;right:18px;color:rgba(255,255,255,.35);font-family:Arial;font-size:14px;z-index:10}
</style>
</head>
<body>
<div id="tela"><div id="vazio">⏳ Carregando imagens...</div></div>
<div id="logo">A TELA DIGITAL</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBxz-Y-QtDuZEwFDv9dyQGziQDqvzf_uaE",
  authDomain: "a-tela-digital.firebaseapp.com",
  projectId: "a-tela-digital",
  storageBucket: "a-tela-digital.firebasestorage.app",
  messagingSenderId: "419054924443",
  appId: "1:419054924443:web:510a842f13a3ec9d174c3e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let imagens = [], idx = 0, duracao = 10, timer = null;

function mostrar(){
  const tela = document.getElementById('tela');
  if(!imagens.length){ tela.innerHTML = '<div id="vazio">📷 Nenhuma imagem ativa.<br>Adicione pelo painel.</div>'; return; }
  const img = document.createElement('img');
  img.src = imagens[idx].imagem;
  img.onload = () => img.classList.add('vis');
  tela.innerHTML = '';
  tela.appendChild(img);
  idx = (idx + 1) % imagens.length;
}
function rodar(){
  clearInterval(timer);
  mostrar();
  timer = setInterval(mostrar, duracao * 1000);
}
db.collection('midia').where('ativa','==',true).orderBy('data','asc').onSnapshot(s => {
  imagens = s.docs.map(d => d.data());
  idx = 0; rodar();
});
db.collection('config').doc('geral').onSnapshot(d => {
  if(d.exists && d.data().duracao){ duracao = d.data().duracao; rodar(); }
});
// Tela cheia ao tocar
document.addEventListener('click', () => {
  if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
});
</script>
</body>
</html>
