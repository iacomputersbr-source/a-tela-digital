<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📺 Tela Digital</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: #0d1117; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 16px; text-align: center; }
  header h1 { font-size: 22px; }
  .busca { padding: 0 16px; }
  .busca input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #333; background: #1a1f2e; color: #fff; font-size: 15px; }
  .busca input::placeholder { color: #8b949e; }
  .cats { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; background: #1a1f2e; border: 1px solid #333; color: #ccc; padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; }
  .chip.sel { background: #ff6a00; border-color: #ff6a00; color: #fff; font-weight: 700; }
  .carr { position: relative; margin: 4px 16px 0; border-radius: 14px; overflow: hidden; aspect-ratio: 16/9; background: #000; }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity .8s; }
  .slide.on { opacity: 1; }
  .slide img { width: 100%; height: 100%; object-fit: cover; }
  .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 14px 12px; background: linear-gradient(transparent, rgba(0,0,0,.85)); }
  .cap b { font-size: 17px; display: block; }
  .cap span { font-size: 12px; color: #ffd9b3; }
  .dots { text-align: center; padding: 10px; min-height: 28px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #444; margin: 0 4px; }
  .dot.on { background: #ff6a00; }
  .vacio { text-align: center; color: #8b949e; padding: 40px 20px; font-size: 15px; }
  .acciones { padding: 4px 16px 0; display: flex; flex-direction: column; gap: 10px; }
  .btn { display: block; text-align: center; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700; text-decoration: none; border: none; cursor: pointer; }
  .btn-wa { background: #25d366; color: #fff; }
  .btn-tela { background: #1a1f2e; color: #fff; border: 1px solid #333; }
  footer { margin-top: auto; padding: 16px; text-align: center; color: #8b949e; font-size: 13px; border-top: 1px solid #222; }
  footer .hora { font-size: 26px; color: #fff; font-weight: 700; }
</style>
</head>
<body>

<header><h1>📺 Tela Digital</h1></header>

<div class="busca"><input id="q" placeholder="🔍 Buscar oferta..." oninput="filtrar()"></div>
<div class="cats" id="cats"></div>

<div class="carr" id="carr"></div>
<div class="dots" id="dots"></div>

<div class="acciones">
  <a class="btn btn-wa" id="btnShare" href="#" target="_blank">💬 Compartir esta oferta por WhatsApp</a>
  <a class="btn btn-tela" id="btnTela" href="#">🌐 Ver tela completa</a>
</div>

<footer>
  <div class="hora" id="hora">--:--</div>
  <div id="saludo">¡Hola!</div>
  <div id="clima">⛅ --° Curitiba</div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBxz-Y-QtDuZEwFDv9dyQGziQDqvzf_uaE",
  authDomain: "a-tela-digital.firebaseapp.com",
  projectId: "a-tela-digital",
  storageBucket: "a-tela-digital.firebasestorage.app",
  messagingSenderId: "419054924443",
  appId: "1:419054924443:web:510a842f13a3ec9d174c3e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const CATS = ['Alimentação','Beleza e Perfumaria','Saúde','Moda','Celulares e Informática','Eletrônicos',
  'Eletrodomésticos','Casa e Decoração','Esporte e Fitness','Automotivo','Bebês e Brinquedos','Pet Shop',
  'Supermercado','Serviços','Educação','Livros e Papelaria','Games e Hobbies','Outros'];

let BASE = location.href.replace(/tela\.html.*$/, '');
if (/^(file:|http:\/\/127\.|http:\/\/localhost|http:\/\/192\.168\.)/.test(BASE)) {
  BASE = 'https://iacomputersbr-source.github.io/a-tela-digital/';
}
document.getElementById('btnTela').href = BASE + 'tela.html';

let TODOS = [], FILTRADOS = [], idx = 0, timer = null, catSel = 'Todos', errMsg = '';

const catsEl = document.getElementById('cats');
catsEl.innerHTML = ['Todos'].concat(CATS).map(function(c) {
  return '<span class="chip' + (c === 'Todos' ? ' sel' : '') + '" onclick="selCat(this,\'' + c + '\')">' + c + '</span>';
}).join('');

function selCat(el, c) {
  document.querySelectorAll('.chip').forEach(function(x) { x.classList.remove('sel'); });
  el.classList.add('sel');
  catSel = c;
  filtrar();
}
function diasRest(venceMs) {
  return Math.max(1, Math.ceil((venceMs - Date.now()) / 86400000));
}
function filtrar() {
  const q = document.getElementById('q').value.toLowerCase().trim();
  FILTRADOS = TODOS.filter(function(a) {
    return (catSel === 'Todos' || a.categoria === catSel) &&
      (!q || (a.nombre + ' ' + a.categoria).toLowerCase().indexOf(q) >= 0);
  });
  idx = 0;
  render();
}
function render() {
  const carr = document.getElementById('carr');
  const dots = document.getElementById('dots');
  carr.innerHTML = ''; dots.innerHTML = '';
  clearInterval(timer);
  if (!FILTRADOS.length) {
    carr.innerHTML = '<div class="vacio">No hay ofertas activas por el momento.<br>Vuelve pronto 📺' +
      (errMsg ? '<br><br><small style="color:#ff8080">⚠️ ' + errMsg + '</small>' : '') + '</div>';
    document.getElementById('btnShare').style.display = 'none';
    return;
  }
  document.getElementById('btnShare').style.display = 'block';
  FILTRADOS.forEach(function(a, i) {
    const s = document.createElement('div');
    s.className = 'slide' + (i === 0 ? ' on' : '');
    s.innerHTML = '<img src="' + a.imagen + '" alt="">' +
      '<div class="cap"><b>🏪 ' + a.nombre + '</b><span>⏳ ' + diasRest(a.venceMs) + ' día(s) · ' + a.categoria + '</span></div>';
    carr.appendChild(s);
    const d = document.createElement('span');
    d.className = 'dot' + (i === 0 ? ' on' : '');
    dots.appendChild(d);
  });
  mostrar(0);
  timer = setInterval(function() { mostrar(idx + 1); }, 8000);
}
function mostrar(i) {
  const slides = document.getElementById('carr').children;
  const ds = document.getElementById('dots').children;
  if (!slides.length || !FILTRADOS.length) return;
  idx = (i + FILTRADOS.length) % FILTRADOS.length;
  for (let k = 0; k < slides.length; k++) {
    slides[k].classList.toggle('on', k === idx);
    if (ds[k]) ds[k].classList.toggle('on', k === idx);
  }
  const a = FILTRADOS[idx];
  const link = BASE + 'oferta.html?c=' + a.clienteId;
  const txt = 'Mira esta oferta en la Tela Digital 📺: ' + a.nombre + ' — ' + link;
  document.getElementById('btnShare').href = 'https://wa.me/?text=' + encodeURIComponent(txt);
}
document.getElementById('carr').addEventListener('click', function() {
  mostrar(idx + 1);
  clearInterval(timer);
  timer = setInterval(function() { mostrar(idx + 1); }, 8000);
});

async function cargar() {
  try {
    const ahora = new Date();
    // Solo un filtro por rango (vence): no necesita índice compuesto.
    // El filtro de inicio se hace aquí en el celular.
    const snap = await db.collection('anuncios')
      .where('vence', '>', ahora)
      .orderBy('vence').get();
    const nowMs = Date.now();
    TODOS = snap.docs.map(function(d) {
      const a = d.data();
      return { imagen: a.imagen, nombre: a.nombre || '', categoria: a.categoria || 'Outros',
               clienteId: a.clienteId, venceMs: a.vence.toMillis(),
               inicioMs: a.inicio ? a.inicio.toMillis() : 0 };
    }).filter(function(a) { return a.inicioMs <= nowMs; });
    errMsg = '';
  } catch (e) { TODOS = []; errMsg = e.message; }
  filtrar();
  setTimeout(cargar, 60000);
}
cargar();

function reloj() {
  const n = new Date();
  document.getElementById('hora').textContent = n.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
  const h = n.getHours();
  document.getElementById('saludo').textContent = h < 12 ? '¡Buenos días! ☀️' : h < 19 ? '¡Buenas tardes! 🌤️' : '¡Buenas noches! 🌙';
}
reloj(); setInterval(reloj, 30000);

fetch('https://api.open-meteo.com/v1/forecast?latitude=-25.43&longitude=-49.27&current=temperature_2m&timezone=America%2FSao_Paulo')
  .then(function(r) { return r.json(); })
  .then(function(j) { document.getElementById('clima').textContent = '⛅ ' + Math.round(j.current.temperature_2m) + '° Curitiba'; })
  .catch(function() {});
</script>
</body>
</html>
