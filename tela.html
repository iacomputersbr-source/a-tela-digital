<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tela Digital Curitiba — Ofertas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: #0d1117; color: #fff; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 14px; }
  /* Topo */
  .topo { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 4px; }
  .logo { font-size: 22px; font-weight: 800; }
  .logo span { color: #ff6a00; }
  .widgets { display: flex; gap: 14px; align-items: center; font-size: 14px; color: #c9d1d9; flex-wrap: wrap; }
  .widgets b { color: #fff; font-size: 16px; }
  /* Carrossel */
  .car { position: relative; border-radius: 16px; overflow: hidden; margin: 6px 0 18px; background: #161b22; }
  .slides { display: flex; transition: transform .5s ease; }
  .slide { min-width: 100%; position: relative; cursor: pointer; }
  .slide img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
  .slide .leg { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 16px 14px;
    background: linear-gradient(transparent, rgba(0,0,0,.85)); }
  .slide .leg b { font-size: 18px; display: block; }
  .slide .leg span { font-size: 13px; color: #ffb37a; }
  .seta { position: absolute; top: 42%; background: rgba(0,0,0,.5); color: #fff; border: none;
    font-size: 22px; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; }
  .seta.e { left: 10px; } .seta.d { right: 10px; }
  .dots { position: absolute; bottom: 64px; left: 0; right: 0; text-align: center; }
  .dots i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.4); margin: 0 4px; }
  .dots i.on { background: #ff6a00; }
  /* Busca */
  .busca { display: flex; gap: 8px; margin-bottom: 10px; }
  .busca input { flex: 1; padding: 13px 16px; border-radius: 12px; border: 1px solid #30363d;
    background: #161b22; color: #fff; font-size: 16px; }
  .busca input:focus { outline: none; border-color: #ff6a00; }
  .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
  .cats button { white-space: nowrap; background: #161b22; color: #c9d1d9; border: 1px solid #30363d;
    border-radius: 20px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
  .cats button.on { background: #ff6a00; border-color: #ff6a00; color: #fff; font-weight: 700; }
  /* Grade */
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .card { background: #161b22; border-radius: 12px; overflow: hidden; border: 1px solid #21262d; }
  .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
  .card .c { padding: 10px 12px; }
  .card .c b { font-size: 14px; display: block; margin-bottom: 2px; }
  .card .c small { color: #8b949e; font-size: 12px; }
  .card .tag { display: inline-block; font-size: 11px; background: #ff6a00; color: #fff; font-weight: 700;
    border-radius: 12px; padding: 2px 10px; margin: 6px 0; }
  .card .wa { display: block; text-align: center; background: #25d366; color: #fff; text-decoration: none;
    font-weight: 700; font-size: 13px; border-radius: 8px; padding: 9px; margin-top: 6px; }
  .vazio { text-align: center; color: #8b949e; padding: 40px 10px; grid-column: 1/-1; }
  /* Rodapé */
  footer { margin: 26px 0 10px; text-align: center; }
  .anuncie { display: inline-block; background: #ff6a00; color: #fff; text-decoration: none; font-weight: 800;
    font-size: 16px; border-radius: 12px; padding: 14px 28px; }
  footer p { color: #8b949e; font-size: 12px; margin-top: 10px; }
  @media (min-width: 760px) {
    .logo { font-size: 28px; }
    .slide .leg b { font-size: 24px; }
    .grade { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topo">
    <div class="logo">📺 Tela<span>Digital</span> Curitiba</div>
    <div class="widgets">
      <span id="saudacao">👋</span>
      <span>🕐 <b id="relogio">--:--</b></span>
      <span id="data"></span>
      <span>🌡️ <b id="temp">--°</b> Curitiba</span>
    </div>
  </div>

  <div class="car" id="car" style="display:none">
    <div class="slides" id="slides"></div>
    <button class="seta e" onclick="muda(-1)">‹</button>
    <button class="seta d" onclick="muda(1)">›</button>
    <div class="dots" id="dots"></div>
  </div>

  <div class="busca">
    <input id="q" placeholder="🔍 Buscar oferta, loja ou produto..." oninput="filtrar()">
  </div>
  <div class="cats" id="cats"></div>

  <div class="grade" id="grade"><div class="vazio">Carregando ofertas...</div></div>

  <footer>
    <a class="anuncie" href="https://wa.me/5541997294355?text=Quero%20anunciar%20na%20Tela%20Digital%20📺" target="_blank">📢 Quer anunciar aqui? Fale conosco</a>
    <p>Tela Digital Curitiba · (41) 99729-4355</p>
  </footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBxz-Y-QtDuZEwFDv9dyQGziQDqvzf_uaE",
  authDomain: "a-tela-digital.firebaseapp.com",
  projectId: "a-tela-digital",
  storageBucket: "a-tela-digital.firebasestorage.app",
  messagingSenderId: "419054924443",
  appId: "1:419054924443:web:510a842f13a3ec9d174c3e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const CATS = ['Todas','Alimentação','Beleza','Saúde','Serviços','Moda','Tecnologia','Casa','Educação','Outros'];
let catAtiva = 'Todas';
let todos = [];
let idx = 0, timer = null;

/* Relógio, data, saudação */
function relogio() {
  const n = new Date();
  document.getElementById('relogio').textContent = n.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('data').textContent = n.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'short'});
  const h = n.getHours();
  document.getElementById('saudacao').textContent = h < 12 ? '☀️ Bom dia' : h < 18 ? '🌤️ Boa tarde' : '🌙 Boa noite';
}
setInterval(relogio, 1000); relogio();

/* Clima Curitiba (Open-Meteo, sem chave) */
fetch('https://api.open-meteo.com/v1/forecast?latitude=-25.43&longitude=-49.27&current=temperature_2m&timezone=America%2FSao_Paulo')
  .then(r => r.json()).then(j => {
    if (j.current) document.getElementById('temp').textContent = Math.round(j.current.temperature_2m) + '°C';
  }).catch(() => {});

/* Categorias */
const catsEl = document.getElementById('cats');
CATS.forEach(c => {
  const b = document.createElement('button');
  b.textContent = c; if (c === 'Todas') b.classList.add('on');
  b.onclick = () => { catAtiva = c; catsEl.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); filtrar(); };
  catsEl.appendChild(b);
});

/* Carrega anúncios ativos (não vencidos) */
db.collection('anuncios').orderBy('creado', 'desc').get().then(snap => {
  const agora = Date.now();
  todos = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(a => a.vence && a.vence.toMillis() > agora);
  montaCarrossel();
  filtrar();
}).catch(() => {
  document.getElementById('grade').innerHTML = '<div class="vazio">Erro ao carregar. Verifique sua conexão.</div>';
});

function montaCarrossel() {
  if (!todos.length) return;
  const dest = todos.slice(0, 10);
  document.getElementById('car').style.display = 'block';
  document.getElementById('slides').innerHTML = dest.map(a =>
    '<div class="slide" onclick="waLoja(\'' + a.telefono + '\',\'' + esc(a.titulo).replace(/'/g,'') + '\')">' +
    '<img src="' + a.imagen + '" loading="lazy">' +
    '<div class="leg"><span>' + esc(a.nombre) + ' · ' + esc(a.categoria) + '</span><b>' + esc(a.titulo) + '</b></div></div>'
  ).join('');
  document.getElementById('dots').innerHTML = dest.map((_, i) => '<i class="' + (i === 0 ? 'on' : '') + '"></i>').join('');
  idx = 0; clearInterval(timer);
  timer = setInterval(() => muda(1), 8000);
}
function muda(d) {
  const n = document.querySelectorAll('.slide').length; if (!n) return;
  idx = (idx + d + n) % n;
  document.getElementById('slides').style.transform = 'translateX(-' + idx * 100 + '%)';
  document.querySelectorAll('.dots i').forEach((el, i) => el.classList.toggle('on', i === idx));
  clearInterval(timer); timer = setInterval(() => muda(1), 8000);
}

function filtrar() {
  const q = document.getElementById('q').value.toLowerCase().trim();
  const g = document.getElementById('grade');
  const res = todos.filter(a =>
    (catAtiva === 'Todas' || a.categoria === catAtiva) &&
    (!q || (a.titulo + ' ' + a.nombre + ' ' + a.categoria).toLowerCase().includes(q))
  );
  if (!res.length) { g.innerHTML = '<div class="vazio">😕 Nenhuma oferta encontrada.<br>Tente outra busca ou categoria.</div>'; return; }
  g.innerHTML = res.map(a =>
    '<div class="card"><img src="' + a.imagen + '" loading="lazy"><div class="c">' +
    '<span class="tag">' + esc(a.categoria) + '</span>' +
    '<b>' + esc(a.titulo) + '</b><small>🏪 ' + esc(a.nombre) + '</small>' +
    '<a class="wa" target="_blank" href="https://wa.me/55' + a.telefono + '?text=' + encodeURIComponent('Olá! Vi sua oferta na Tela Digital: ' + a.titulo) + '">💬 Chamar no WhatsApp</a>' +
    '</div></div>'
  ).join('');
}
function waLoja(tel, titulo) {
  window.open('https://wa.me/55' + tel + '?text=' + encodeURIComponent('Olá! Vi sua oferta na Tela Digital: ' + titulo), '_blank');
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
