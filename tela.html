<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Tela Digital 📺</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
  #tela{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  #tela img{position:absolute;max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity 1s ease}
  #tela img.visivel{opacity:1}
  #vazio{color:#777;text-align:center;font-size:clamp(18px,4vw,42px);line-height:1.6;padding:20px}
  #marca{position:fixed;bottom:12px;right:18px;color:rgba(255,255,255,.35);font-size:14px;letter-spacing:3px;z-index:10}
</style>
</head>
<body>
<div id="tela">
  <div id="vazio">📷 Nenhuma imagem ativa.<br>Adicione pelo painel.</div>
</div>
<div id="marca">A TELA DIGITAL</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBxz-Y-QtDuZEwFDv9dyQGziQDqvzf_uaE",
  authDomain: "a-tela-digital.firebaseapp.com",
  projectId: "a-tela-digital",
  storageBucket: "a-tela-digital.firebasestorage.app",
  messagingSenderId: "419054924443",
  appId: "1:419054924443:web:510a842f13a3ec9d174c3e",
  measurementId: "G-W5YVP430ES"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const tela = document.getElementById('tela');
let imagens = [];
let indice = 0;
let atual = null;
let intervaloMs = 8000;
let timerRotacao = null;

function mostrar(){
  if(!imagens.length) return;
  const el = document.createElement('img');
  el.src = imagens[indice];
  el.onload = () => el.classList.add('visivel');
  el.onerror = () => el.remove();
  tela.appendChild(el);
  if(atual){ const velho = atual; setTimeout(()=>velho.remove(), 1100); }
  atual = el;
  indice = (indice + 1) % imagens.length;
}

function iniciarRotacao(){
  if(timerRotacao) clearInterval(timerRotacao);
  mostrar();
  timerRotacao = setInterval(mostrar, intervaloMs);
}

async function carregar(){
  try{
    const cfgDoc = await db.collection('config').doc('geral').get();
    if(cfgDoc.exists && cfgDoc.data().intervalo){
      intervaloMs = cfgDoc.data().intervalo * 1000;
    }
    const agora = new Date();
    const snap = await db.collection('clientes')
      .where('expiraEm','>',agora)
      .orderBy('expiraEm','asc')
      .get();
    imagens = snap.docs.map(d => d.data().imagemData || d.data().imagemURL).filter(Boolean);
    const vazio = document.getElementById('vazio');
    if(imagens.length){
      if(vazio) vazio.remove();
      indice = 0;
      if(atual){ atual.remove(); atual = null; }
      iniciarRotacao();
    } else {
      if(timerRotacao) clearInterval(timerRotacao);
      if(!vazio){
        tela.innerHTML = '<div id="vazio">📷 Nenhuma imagem ativa.<br>Adicione pelo painel.</div>';
      }
    }
  }catch(e){ console.error('Erro ao carregar:', e); }
}

carregar();
setInterval(carregar, 60000);
</script>
</body>
</html>
