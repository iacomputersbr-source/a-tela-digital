<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Tela Digital 📺</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
  #tela{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  #tela img{position:absolute;max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity 1s ease}
  #tela img.visivel{opacity:1}
  #vazio{color:#777;text-align:center;font-size:clamp(18px,4vw,42px);line-height:1.6;padding:20px}
  #marca{position:fixed;bottom:12px;right:18px;color:rgba(255,255,255,.35);font-size:14px;letter-spacing:3px;z-index:10}
</style>
</head>
<body>
<div id="tela">
  <div id="vazio">📷 Nenhuma imagem ativa.<br>Adicione pelo painel.</div>
</div>
<div id="marca">A TELA DIGITAL</div>
<script src="config.js"></script>
<script>
(function(){
  var tela=document.getElementById('tela');
  var vazio=document.getElementById('vazio');
  var cfg=(typeof CONFIG!=='undefined')?CONFIG:{imagens:[],intervalo:8};
  var imgs=(cfg.imagens||[]).filter(function(s){return s && s.trim();});
  (cfg.clientes||[]).forEach(function(cl){
    (cl.anuncios||[]).forEach(function(a){
      if(a && a.img && a.img.trim()) imgs.push(a.img.trim());
    });
  });
  if(!imgs.length){return;}
  vazio.remove();
  var versao=Date.now(); // evita cache antigo do GitHub
  var i=0, atual=null;
  var intervalo=(cfg.intervalo||8)*1000;
  imgs.forEach(function(s){var p=new Image();p.src=s+'?v='+versao;});
  function mostrar(){
    var el=document.createElement('img');
    el.src=imgs[i]+'?v='+versao;
    el.onload=function(){el.classList.add('visivel');};
    el.onerror=function(){el.remove();};
    tela.appendChild(el);
    if(atual){var velho=atual;setTimeout(function(){velho.remove();},1100);}
    atual=el;
    i=(i+1)%imgs.length;
  }
  mostrar();
  setInterval(mostrar,intervalo);
})();
</script>
</body>
</html>
