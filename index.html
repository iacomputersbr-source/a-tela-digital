<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Tela Digital · Ofertas e Promoções em Curitiba</title>
<meta name="description" content="A Tela Digital: a vitrine digital de Curitiba. Ofertas do Atacadão, roupas, calçados, farmácia, celulares, games e muito mais girando 24h na tela. Anuncie sua oferta!">
<meta name="keywords" content="ofertas curitiba, promoções curitiba, atacadão ofertas, tela digital, descontos, vitrine digital">
<meta property="og:title" content="A Tela Digital · Ofertas em Curitiba">
<meta property="og:description" content="As melhores ofertas da cidade girando em uma tela gigante. Confira!">
<meta property="og:type" content="website">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--laranja:#f97316;--amarelo:#fbbf24;--zap:#25d366;--fundo:#0a0a0a;--painel:#141414}
body{background:var(--fundo);font-family:Arial,Helvetica,sans-serif;color:#fff;min-height:100vh}
.topo{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#000;border-bottom:3px solid var(--laranja)}
.topo img{height:44px}
.ao-vivo{color:#4ade80;font-weight:bold;font-size:13px}
.ao-vivo i{display:inline-block;width:9px;height:9px;background:#22c55e;border-radius:50%;margin-right:6px;animation:piscar 1s infinite}
@keyframes piscar{50%{opacity:.2}}
.ticker{background:linear-gradient(90deg,var(--laranja),var(--amarelo));color:#000;overflow:hidden;white-space:nowrap;font-weight:900;font-size:14px;padding:8px 0}
.ticker div{display:inline-block;animation:rolar 25s linear infinite}
@keyframes rolar{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.tela{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.anuncio{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px}
.anuncio.on{display:flex}
.anuncio h2{font-size:clamp(28px,6vw,72px);font-weight:900;text-shadow:0 4px 20px rgba(0,0,0,.6);margin-bottom:10px}
.anuncio.cat{display:inline-block;background:#000;color:var(--amarelo);font-weight:900;letter-spacing:3px;font-size:13px;padding:6px 16px;border-radius:20px;margin-bottom:14px;border:2px solid var(--amarelo)}
.anuncio.preco{font-size:clamp(40px,9vw,110px);font-weight:900;color:#fff;text-shadow:0 0 30px rgba(255,255,255,.35);margin:8px 0}
.anuncio.loja{font-size:clamp(14px,2.5vw,22px);color:#fff;background:rgba(0,0,0,.45);display:inline-block;padding:8px 20px;border-radius:10px;margin-top:10px}
.barra{height:6px;background:#1f1f1f}
.barra div{height:100%;width:0;background:linear-gradient(90deg,var(--laranja),var(--amarelo))}
.ctrl{display:flex;gap:10px;align-items:center;padding:12px 16px;background:var(--painel)}
.ctrl button{background:#1f1f1f;color:#fff;border:1px solid #333;border-radius:8px;padding:10px 16px;font-weight:bold;cursor:pointer;font-size:15px}
.ctrl.pos{margin-left:auto;color:var(--amarelo);font-weight:bold;font-size:14px}
.filtros{padding:14px 12px}
.filtros.linha{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--painel);border:1px solid #333;color:#ddd;padding:9px 15px;border-radius:20px;font-size:13px;font-weight:bold;cursor:pointer}
.chip.on{background:var(--laranja);border-color:var(--laranja);color:#000}
.busca{width:100%;margin-top:10px;padding:13px;border-radius:10px;border:1px solid #333;background:var(--painel);color:#fff;font-size:15px}
.acoes{display:flex;gap:10px;padding:0 12px 6px}
.acoes button{flex:1;padding:15px;border:none;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer}
.btn-anunciar{background:linear-gradient(90deg,var(--laranja),var(--amarelo));color:#000}
.btn-part{background:#1f1f1f;color:#fff;border:1px solid #444}
.quero{position:absolute;bottom:18px;right:18px;background:var(--zap);color:#fff;border:none;border-radius:30px;padding:14px 28px;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 4px 20px rgba(37,211,102,.5)}
.contato{margin:16px 12px;background:var(--painel);border:2px solid var(--laranja);border-radius:14px;padding:20px;text-align:center}
.contato h3{color:var(--amarelo);margin-bottom:8px;font-size:20px}
.contato p{color:#ccc;font-size:14px;margin-bottom:14px}
.contato.zap{background:var(--zap);color:#fff;border:none;border-radius:12px;padding:15px 30px;font-weight:900;font-size:17px;cursor:pointer;width:100%}
footer{text-align:center;color:#666;font-size:12px;padding:20px}
</style>
</head>
<body>
<div class="topo">
<img src="logo-branco.png" alt="A Tela Digital">
<div class="ao-vivo"><i></i>AO VIVO · <span id="relogio"></span></div>
</div>
<div class="ticker"><div id="tickerTxt"></div></div>
<div class="tela" id="tela"></div>
<div class="barra"><div id="prog"></div></div>
<div class="ctrl">
<button onclick="anterior()">◀</button>
<button id="btnPlay" onclick="alternar()">⏸ Pausar</button>
<button onclick="proximo()">▶</button>
<span class="pos" id="pos">Anúncio 1/1</span>
</div>
<div class="filtros">
<div class="linha" id="cats"></div>
<input class="busca" id="q" placeholder="🔍 Buscar oferta... (ex: tênis, pizza, celular)" oninput="filtrar()">
</div>
<div class="acoes">
<button class="btn-anunciar" onclick="anunciar()">📢 ANUNCIAR NA TELA</button>
<button class="btn-part" onclick="partilhar()">🔗 COMPARTILHAR</button>
</div>
<div class="contato">
<h3>📢 Quer ver sua oferta na tela?</h3>
<p>Fale conosco no WhatsApp e garanta seu espaço girando 24h na Tela Digital.<br>Planos por dia, semana ou mês.</p>
<button class="zap" onclick="anunciar()">💬 CHAMAR NO WHATSAPP</button>
<p style="margin-top:10px;font-size:13px">+55 (41) 99729-4355</p>
</div>
<footer>A TELA DIGITAL · Ofertas e promoções em Curitiba · Todos os direitos reservados</footer>
<script>
var ZAP="5541997294355";
var CATS=["Ofertas do Dia","Atacadão","Celulares","Informática","Eletrodomésticos","Eletrônicos","Games","Moda","Calçados","Beleza","Saúde","Farmácia","Esporte","Brinquedos","Casa e Decoração","Automotivo","Pet Shop","Supermercado","Ferramentas","Serviços"];
var ADS=[
{cat:"Atacadão",tit:"ARROZ 5KG + FEIJÃO 1KG",preco:"R$ 19,90",loja:"🏪 Atacadão Curitiba",cor:"linear-gradient(135deg,#c2410c,#f97316)"},
{cat:"Calçados",tit:"TÊNIS 【entity-NIKE¦canonical_name=NIKE】 AIR",preco:"40% OFF",loja:"🏪 Loja do Centro",cor:"linear-gradient(135deg,#92400e,#fbbf24)"},
{cat:"Farmácia",tit:"VITAMINA C 2x1",preco:"R$ 24,90",loja:"🏪 Farmácia Popular",cor:"linear-gradient(135deg,#166534,#4ade80)"},
{cat:"Games",tit:"CONTROLE 【entity-PS5¦canonical_name=PS5】",preco:"R$ 399",loja:"🏪 Game Store",cor:"linear-gradient(135deg,#7c2d12,#fb923c)"},
{cat:"Beleza",tit:"KIT SHAMPOO + CONDICIONADOR",preco:"R$ 49,90",loja:"🏪 Beleza Pura",cor:"linear-gradient(135deg,#9a3412,#fde68a)"},
{cat:"Pet Shop",tit:"RAÇÃO 10KG",preco:"R$ 89,90",loja:"🏪 Pet Amigo",cor:"linear-gradient(135deg,#78350f,#f59e0b)"},
{cat:"Celulares",tit:"XIAOMI REDMI NOTE",preco:"12x R$ 99",loja:"🏪 Cell Shop",cor:"linear-gradient(135deg,#431407,#ea580c)"}
];
var ROT=8000,idx=0,fCat="",fQ="",playing=true,timer=null,last=Date.now();
function lista(){return ADS.filter(function(a){return(!fCat||a.cat===fCat)&&(!fQ||(a.tit+" "+a.loja).toLowerCase().indexOf(fQ)>-1);});}
function barraCats(){document.getElementById('cats').innerHTML='<button class="chip'+(!fCat?' on':'')+'" onclick="fCat=\'\';filtrar()">Todas</button>'+CATS.map(function(c){return '<button class="chip'+(fCat===c?' on':'')+'" onclick="fCat=\''+c+'\';filtrar()">'+c+'</button>';}).join('');}
function render(){var l=lista();if(idx>=l.length)idx=0;var t=document.getElementById('tela');
t.innerHTML=l.length?l.map(function(a,i){return '<div class="anuncio'+(i===idx?' on':'')+'" style="background:'+a.cor+'"><div><div class="cat">'+a.cat.toUpperCase()+'</div><h2>'+a.tit+'</h2><div class="preco">'+a.preco+'</div><div class="loja">'+a.loja+'</div></div><button class="quero" onclick="querer('+i+')">💬 QUERO ESSA</button></div>';}).join(''):'<div class="anuncio on"><div><h2>Nenhuma oferta aqui 😕</h2><p>Seja o primeiro a anunciar!</p></div></div>';
document.getElementById('pos').textContent=l.length?('Anúncio '+(idx+1)+'/'+l.length):'Sem anúncios';
document.getElementById('tickerTxt').textContent='⚡ '+ADS.map(function(a){return a.tit+' → '+a.preco;}).join(' • ')+' • ';}
function filtrar(){fQ=document.getElementById('q').value.toLowerCase();idx=0;barraCats();render();reiniciar();}
function proximo(){var l=lista();if(l.length)idx=(idx+1)%l.length;render();reiniciar();}
function anterior(){var l=lista();if(l.length)idx=(idx-1+l.length)%l.length;render();reiniciar();}
function alternar(){playing=!playing;document.getElementById('btnPlay').textContent=playing?'⏸ Pausar':'▶ Continuar';reiniciar();}
function reiniciar(){clearInterval(timer);last=Date.now();if(playing)timer=setInterval(function(){var l=lista();if(l.length>1){idx=(idx+1)%l.length;render();}last=Date.now();},ROT);}
setInterval(function(){if(!playing)return;document.getElementById('prog').style.width=Math.min((Date.now()-last)/ROT*100,100)+'%';},100);
setInterval(function(){var d=new Date();document.getElementById('relogio').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);},1000);
function querer(i){var a=lista()[i];window.open('https://wa.me/'+ZAP+'?text='+encodeURIComponent('Olá! Vi sua oferta na A TELA DIGITAL: '+a.tit+' por '+a.preco+'. Ainda está disponível?'),'_blank');}
function anunciar(){window.open('https://wa.me/'+ZAP+'?text='+encodeURIComponent('Olá! Quero anunciar minha oferta na A TELA DIGITAL. Me passa os valores dos espaços.'),'_blank');}
function partilhar(){var t='📺 Confira A TELA DIGITAL! As melhores ofertas de Curitiba em um só lugar 👉 ';if(navigator.share)navigator.share({title:'A Tela Digital',text:t,url:location.href});else{var e=document.createElement('input');e.value=t+location.href;document.body.appendChild(e);e.select();document.execCommand('copy');e.remove();alert('🔗 Link copiado! Cole nos seus grupos de WhatsApp.');}}
barraCats();render();reiniciar();
</script>
</body>
  </html>
