<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ofertas | A Tela Digital</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff;min-height:100vh;display:flex;flex-direction:column}
header{background:#f97316;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header.logo{font-weight:bold;color:#000;font-size:16px}
.lang button{background:#000;color:#fff;border:none;border-radius:14px;padding:6px 11px;margin-left:6px;font-size:13px;opacity:.6}
.lang button.on{opacity:1;outline:2px solid #fff}
main{flex:1;max-width:560px;width:100%;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.negocio{background:#1c1c1c;border:1px solid #333;border-radius:14px;padding:18px;text-align:center}
.negocio h1{font-size:22px;color:#f97316;margin-bottom:4px}
.negocio p{color:#aaa;font-size:13px}
.anuncio{background:#000;border:1px solid #333;border-radius:14px;overflow:hidden}
.anuncio img{width:100%;display:block}
.info{background:#1c1c1c;border:1px solid #333;border-radius:14px;padding:14px 18px;font-size:14px;color:#ddd;line-height:2}
.info b{color:#f97316}
.btn{display:block;text-align:center;padding:15px;border-radius:12px;font-size:17px;font-weight:bold;text-decoration:none;margin-top:4px}
.btn.wa{background:#25d366;color:#fff}
.btn.share{background:#f97316;color:#000;border:none;cursor:pointer;width:100%}
#estado{text-align:center;padding:60px 20px;color:#888;font-size:17px;line-height:2}
footer{text-align:center;padding:18px;color:#666;font-size:12px}
footer b{color:#f97316}
</style>
</head>
<body>
<header>
  <div class="logo">A TELA DIGITAL</div>
  <div class="lang"><button id="bPT" class="on" onclick="setLang('pt')">BR</button><button id="bES" onclick="setLang('es')">ES</button></div>
</header>
<main id="conteudo"><div id="estado">Carregando...</div></main>
<footer><b>A TELA DIGITAL</b> - IA COMPUTERS - Curitiba<br><span data-pt="Sua propaganda na tela da sua loja" data-es="Tu publicidad en la pantalla de tu tienda">Sua propaganda na tela da sua loja</span></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBxz-Y-QtDuZEwFDv9dyQGziQDqvzf_uaE",
  authDomain: "a-tela-digital.firebaseapp.com",
  projectId: "a-tela-digital",
  storageBucket: "a-tela-digital.firebasestorage.app",
  messagingSenderId: "419054924443",
  appId: "1:419054924443:web:510a842f13a3ec9d174c3e",
  measurementId: "G-W5YVP430ES"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const T = {
  pt: {carregando:'Carregando...', invalido:'Link invalido.', finalizada:'Esta oferta ja terminou.<br>Fale com a loja para novidades!',
    valida:'Oferta valida ate', compartilhar:'Compartilhar oferta', chamar:'Chamar no WhatsApp', erro:'Erro ao carregar.'},
  es: {carregando:'Cargando...', invalido:'Link invalido.', finalizada:'Esta oferta ya termino.<br>Habla con la tienda para novedades!',
    valida:'Oferta valida hasta', compartilhar:'Compartir oferta', chamar:'Escribir por WhatsApp', erro:'Error al cargar.'}
};
let lang = 'pt';
let dados = null;

function setLang(l){
  lang = l;
  document.getElementById('bPT').classList.toggle('on', l==='pt');
  document.getElementById('bES').classList.toggle('on', l==='es');
  document.querySelectorAll('[data-pt]').forEach(function(el){ el.textContent = (l==='pt')? el.dataset.pt : el.dataset.es; });
  if(dados) render(dados); else init();
}

function esc(s){ return String(s||'').replace(/[&<>"]/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]); }); }

function foneParaWa(f){
  const d = String(f||'').replace(/\D/g,'');
  if(d.length === 10 || d.length === 11) return '55' + d;
  return d;
}

function dataFmt(ts){
  try{ return ts.toDate().toLocaleDateString(lang==='pt'?'pt-BR':'es', {day:'2-digit',month:'2-digit',year:'numeric'}); }
  catch(e){ return ''; }
}

function render(c){
  const wa = foneParaWa(c.telefone);
  const img = c.imagemData || c.imagemURL || '';
  let html = '<div class="negocio"><h1>' + esc(c.nome) + '</h1><p>' + esc(c.planoRotulo||'') + '</p></div>';
  if(img) html += '<div class="anuncio"><img src="' + img + '" alt="oferta"></div>';
  html += '<div class="info">' + T[lang].valida + ': <b>' + dataFmt(c.expiraEm) + '</b></div>';
  if(wa) html += '<a class="btn wa" target="_blank" href="https://wa.me/' + wa + '">' + T[lang].chamar + '</a>';
  html += '<button class="btn share" onclick="compartilhar()">' + T[lang].compartilhar + '</button>';
  document.getElementById('conteudo').innerHTML = html;
}

async function compartilhar(){
  const texto = (dados? dados.nome : 'Ofertas') + ' - ' + T[lang].compartilhar;
  const url = location.href;
  if(navigator.share){
    try{ await navigator.share({title: texto, text: texto, url: url}); }catch(e){}
  } else {
    window.open('https://wa.me/?text=' + encodeURIComponent(texto + ' ' + url), '_blank');
  }
}

async function init(){
  const id = new URLSearchParams(location.search).get('id');
  const box = document.getElementById('conteudo');
  if(!id){ box.innerHTML = '<div id="estado">' + T[lang].invalido + '</div>'; return; }
  try{
    const doc = await db.collection('clientes').doc(id).get();
    if(!doc.exists){ box.innerHTML = '<div id="estado">' + T[lang].invalido + '</div>'; return; }
    const c = doc.data();
    const vigente = c.ativo!== false && c.expiraEm && c.expiraEm.toDate().getTime() > Date.now();
    if(!vigente){ box.innerHTML = '<div id="estado">' + T[lang].finalizada + '</div>'; return; }
    dados = c;
    render(c);
  }catch(e){
    box.innerHTML = '<div id="estado">' + T[lang].erro + '</div>';
  }
}
init();
</script>
</body>
  </html>
